name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provenance tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Provenance registry matches the files and both READMEs
        run: python3 scripts/procedencia.py comprobar

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the AI-assistance disclosure in both READMEs
        run: |
          grep -Eiq "Claude \(Anthropic\)" README.md || { echo "::error::README.md is missing the AI-assistance disclosure"; exit 1; }
          grep -Eiq "Claude \(Anthropic\)" README.es.md || { echo "::error::README.es.md is missing the AI-assistance disclosure"; exit 1; }
