[extend]
useDefault = true

# procedencia.json guarda el SHA-256 de archivos públicos de terceros. Algunos se llaman
# secrets.md o auth.md (guías de las skills), y la regla genérica confunde el hash con una
# clave. La versión de gitleaks de la CI (8.24) no permite acotar la excepción a una regla,
# así que se exime la ruta; el archivo es un registro generado y no contiene credenciales.
[allowlist]
description = "SHA-256 de archivos públicos en procedencia.json, no son claves"
paths = ['''^procedencia\.json$''']
